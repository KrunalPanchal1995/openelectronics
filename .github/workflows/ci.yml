name: Checks

on:
  push:
  pull_request:

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Every figure regenerates
        run: |
          python codes/make_ee_figures.py
          test "$(find course -name '*-1600.png' | wc -l)" -eq 20
